[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Both hold public addresses on the same domain the site renders on screen,
  # so secrets scanning matches them in the bundle. Never add RESEND_API_KEY.
  SECRETS_SCAN_OMIT_KEYS = "CONTACT_NOTIFICATION_EMAIL,RESEND_FROM_EMAIL"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  autoLaunch = true
  framework = "#custom"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 