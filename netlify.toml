[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Public contact address, rendered in the site itself, so secrets scanning
  # would otherwise flag every page that displays it.
  SECRETS_SCAN_OMIT_KEYS = "CONTACT_NOTIFICATION_EMAIL"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  autoLaunch = true
  framework = "#custom"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200 